
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marklands Secondary School | Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            background:
                linear-gradient(135deg, rgba(40,0,10,.92), rgba(122,0,25,.85)),
                url('/SC.jpeg') center/cover no-repeat;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 750px;
            text-align: center;
            padding: 60px 30px;
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 25px;
            background: rgba(255,255,255,.10);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
            animation: appear 1.2s ease;
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 25px;
        }

        .school-name {
            font-size: 15px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #ffffff;
        }

        h1 {
            font-size: clamp(38px, 8vw, 68px);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        h1 span {
            color: #ffccd5;
        }

        .description {
            font-size: 17px;
            line-height: 1.8;
            color: rgba(255,255,255,.85);
            max-width: 550px;
            margin: 0 auto 30px;
        }

        .coming {
            display: inline-block;
            padding: 13px 30px;
            border: 1px solid rgba(255,255,255,.5);
            border-radius: 50px;
            background: rgba(255,255,255,.15);
            font-size: 13px;
            letter-spacing: 3px;
            font-weight: bold;
        }

        .slogan {
            margin-top: 40px;
            font-size: 14px;
            letter-spacing: 3px;
            font-weight: 600;
        }

        footer {
            margin-top: 45px;
            font-size: 12px;
            color: rgba(255,255,255,.65);
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width: 600px) {
            .container {
                padding: 45px 20px;
            }

            .logo {
                width: 90px;
                height: 90px;
            }

            .description {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- Replace with your school logo -->
        <img src="/MS.png" alt="Marklands School Logo" class="logo">

        <p class="school-name">Marklands Secondary School</p>

        <h1>Something <span>Great</span><br>Is Coming.</h1>

        <p class="description">
            We are working behind the scenes to bring you a brand-new
            online experience. Our official school website is currently
            under development.
        </p>

        <div class="coming">
            WEBSITE COMING SOON
        </div>

        <p class="slogan">
            LEARN &bull; GROW &bull; SUCCEED
        </p>

        <footer>
            &copy; 2026 Marklands Secondary School. All Rights Reserved.
        </footer>

    </main>

</body>
</html>
